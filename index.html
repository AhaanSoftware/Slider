  <style>
    .swiper {
      width: 100%;
      
    }
    .swiper-slide {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
     
      font-size: 18px;
      padding: 10px;
      box-sizing: border-box;
      
    }
    .flag {
      
      margin-bottom: 10px;
    }
    .swiper-slide a {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color:black;
 
}

.swiper-slide a:hover {
  opacity: 0.8; 
  text-decoration: underline;
}

.swiper-slide img {
  width: 100%;
  max-width: 150px; /* Limit the image size */
  border-radius: 8px;
  box-shadow: 0 12px 16px rgba(0, 0, 0, 0.2); /* Stronger shadow with larger spread and blur */
  transition: box-shadow 0.3s ease;
}

.swiper-slide img:hover {
  box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3); /* Even stronger shadow on hover */
}


.swiper-slide a div {
  margin-top: 10px; /* Add some space between the image and the country name */
  font-size: 16px;
}
/* Style the next/prev buttons */
.swiper-button-next, .swiper-button-prev {
  width: 30px; /* Set width */
  height: 30px; /* Set height */
  border-radius: 50%; /* Make the button round */
  background-color: #007BFF; /* Button color */
  display: flex;
  justify-content: center;
  align-items: center;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10; /* Ensure the buttons are on top of the slides */
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Optional: Add a subtle shadow */
  cursor: pointer;
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}

/* Next button - position it on the right */
.swiper-button-next {
  right: 10px; /* Adjust the right position */
}

/* Previous button - position it on the left */
.swiper-button-prev {
  left: 10px; /* Adjust the left position */
}

/* Add arrow icons inside the buttons */
.swiper-button-next::after, .swiper-button-prev::after {
  font-family: 'Font Awesome 5 Free'; /* Use FontAwesome for icons */
  content: '';
  font-size: 16px; /* Adjust the size of the arrow */
  color: white; /* Arrow color */
  font-weight: 900; /* Make the arrow bold */
}

/* Style for next arrow */
.swiper-button-next::after {
  content: '\f061'; /* Right arrow icon */
}

/* Style for previous arrow */
.swiper-button-prev::after {
  content: '\f060'; /* Left arrow icon */
}

/* Hover effect */
.swiper-button-next:hover, .swiper-button-prev:hover {
  background-color: #0056b3; /* Darker button color on hover */
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* Larger shadow on hover */
}



  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      direction: 'horizontal',
      loop: true,
      slidesPerView: 6, 
      spaceBetween: 10, 
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      loopedSlides: 6, 
      breakpoints: {
        
        1200: {
          slidesPerView: 6,
        }, 
        768: {
          slidesPerView: 3,
        },
        480: {
          slidesPerView: 2,
        },
        320: {
          slidesPerView: 1,
        },
      }
    });
  </script>
